    if (resp.status === 401) resp = await send();
    const data = await resp.json().catch(()=>({}));

        status: resp.status
      }));
    }
    return data;
  }

  // --- Custom dropdown (matches the WordPress plugin's font + design) ---------
  // Native <select> option lists are OS-rendered and ignore the page font, so a
  // custom control is used to keep the Inter typeface and the plugin's styling.
  function customSelect(options, initial, onChange) {
    const node = el("div", {
      class: "pub-select"
    });
    node.pubValue = initial;
    const labelEl = el("span", {
      class: "pub-select-value"
    });
    const setLabel = (v)=>{
      const o = options.find((x)=>x.value === v);
      labelEl.textContent = o ? t(o.label) : "";
    };
    setLabel(initial);
    const trigger = el("button", {
      class: "pub-select-btn",
      type: "button"
    }, [
      labelEl,
      icon("chevron-down", 16, "pub-select-chev")
    ]);
    const list = el("div", {
      class: "pub-select-list",
      role: "listbox"
    });
    const rebuild = ()=>{
      list.innerHTML = "";
      for (const o of options){
        const item = el("button", {
          class: "pub-select-option" + (o.value === node.pubValue ? " is-selected" : ""),
          type: "button"
        }, [
          o.label
        ]);
        item.onclick = ()=>{
          node.pubValue = o.value;
          setLabel(o.value);
          close();
          if (onChange) onChange(o.value);
        };
        list.append(item);
      }
    };
    const outside = (e)=>{
      if (!node.contains(e.target)) close();
    };
    const open = ()=>{
      rebuild();
      node.classList.add("is-open");
      setTimeout(()=>document.addEventListener("click", outside), 0);
    };
    const close = ()=>{
      node.classList.remove("is-open");
      document.removeEventListener("click", outside);
    };
    trigger.onclick = ()=>{
      node.classList.contains("is-open") ? close() : open();
    };
    node.append(trigger, list);
    return node;
  }

    const blogSel = customSelect(blogOpts, state.settings.default_blog_id || "");
    card.append(field("Default blog for articles", blogSel));
    const out = el("span", {

  }
  function billingPanel() {
    // Shopify App Pricing: plans are chosen/managed on Shopify's hosted pricing
    // page. We show the current status and a button that opens that page at the
    // TOP level (an <a target="_top"> — a user gesture leaving the admin iframe).
    const card = el("div", {
      class: "pub-card pub-card-no-hover"
    });
    card.append(el("p", {
      class: "pub-hint"
    }, [
      "Your Publicator Webshop plan is billed securely through Shopify. Choose or manage it on Shopify's billing page."
    ]));
    const body = el("div", {});
    body.append(el("span", {
      class: "pub-inline-note"
    }, [
      "Loading plan…"
    ]));
    card.append(body);
    billingRequest().then((r)=>{
      body.innerHTML = "";
      const sub = r.subscription;
      if (sub) {
        const frozen = sub.status === "FROZEN";
        body.append(el("div", {
          class: "pub-info-grid"
        }, [
          infoItem("Current plan", sub.displayName || sub.name || "—"),
          infoItem("Status", t(frozen ? "Paused (payment issue)" : "Active")),
          frozen ? null : infoItem("Renews", fmtDate(sub.currentPeriodEnd))
        ]));
        // The plan is active in Shopify but did not land on the project.
        const problem = {
          failed: "Your plan is active in Shopify, but we couldn't apply it to your Publicator project yet. Please reload in a minute or contact info@publicator.ai.",
          unmapped_plan: "Your plan is active in Shopify, but we couldn't apply it to your Publicator project yet. Please reload in a minute or contact info@publicator.ai.",
          not_webshop: "This Shopify plan applies to Publicator Webshop projects, but the connected project is a different Publicator product. Contact info@publicator.ai.",
          stripe_billed: "This project is already billed through Publicator, so the Shopify plan is not applied to it. Contact info@publicator.ai to switch billing."
        };
        if (problem[r.entitlement]) body.append(notice(problem[r.entitlement]));
      } else {
        body.append(el("p", {
          class: "pub-hint"
        }, [
          "No active plan yet. Choose a plan to start publishing SEO content to your store."
        ]));
      }
      const link = el("a", {
        class: "pub-btn pub-btn-primary",
        href: r.pricingUrl || "#",
        target: "_top",
        rel: "noopener"
      }, [
        icon("external-link", 14),
        sub ? "Manage plan" : "Choose a plan"
      ]);
      body.append(el("div", {
        class: "pub-actions"
      }, [
        link
      ]));
    }).catch((e)=>{
      body.innerHTML = "";
      body.append(el("span", {
        class: "pub-inline-note"
      }, [
        e.message
      ]));
    });
    return el("section", {
      class: "pub-tab-panel is-active"
    }, [
      pageHead("Plan", "Your subscription, billed securely through Shopify."),
      card
    ]);
  }

    const section = el("section", {

    }, [

    ]);
    // Language.
    const langCard = el("div", {

    });
    const langOpts = [
      {
        value: "hu_HU",
        label: "Magyar"
      },
      {
        value: "en_US",
        label: "English"
      },
      {
        value: "de_DE",
        label: "Deutsch"
      },
      {
        value: "es_ES",
        label: "Español"
      },
      {
        value: "it_IT",

      },

    const langSel = customSelect(langOpts, state.settings.language || "en_US", async (v)=>{

      ]),

      }, [

      ])
    ]));
    section.append(langCard);
    // Danger. Two steps: the first click explains that the Shopify plan is not

    const danger = el("div", {
      class: "pub-card pub-card-no-hover pub-danger-card"
    });
    const confirmBox = el("div", {});
    const disc = btn("Disconnect", "danger", "log-out", ()=>{
      state.confirmDisconnect = true;
      renderApp();
    });
    if (state.confirmDisconnect) {
      const confirmBtn = btn("Confirm disconnect", "danger", "log-out", async ()=>{
        confirmBtn.disabled = true;
        try {
          await api("shopify-disconnect", {});
          state.confirmDisconnect = false;
          toast("Disconnected");
          await load();
        } catch (e) {
          toast(e.message, true);
          confirmBtn.disabled = false;
        }
      });
      const cancelBtn = btn("Cancel", "ghost", null, ()=>{
        state.confirmDisconnect = false;
        renderApp();
      });
      confirmBox.append(notice("Disconnect this store from Publicator Webshop? Your Shopify plan is not cancelled — manage or cancel it on the Plan tab first."), el("div", {
        class: "pub-actions"

        cancelBtn
      ]));

    danger.append(el("div", {
      class: "pub-danger-row"
    }, [
      el("div", {
        class: "pub-danger-text"
      }, [
        el("div", {
          class: "pub-danger-label"
        }, [
          "Disconnect from Publicator Webshop"
        ]),
        el("p", {
          class: "pub-danger-desc"
        }, [
          "Content already published stays in your store. You can reconnect anytime."

      ]),

    ]), confirmBox);
    section.append(danger);
    return section;

  // One billing sync per app open (it also re-applies the plan to the project);
  // re-renders of the Plan tab reuse it instead of syncing again.
  let billingCache = null;
  function billingRequest() {
    if (!billingCache || Date.now() - billingCache.at > 60_000) {
      billingCache = {
        at: Date.now(),
        req: api("shopify-billing", {})
      };
      billingCache.req.catch(()=>{
        billingCache = null; // let the next view retry after a failure
      });
    }
    return billingCache.req;
  }
  // --- Boot ------------------------------------------------------------------
  async function load() {
    // Every load (open, after connect/disconnect) syncs the plan afresh — a
    // cached result from before a reconnect would hide the new project's state.
    billingCache = null;
    setRoot(loadingBlock("Loading live data…"));
    try {
      const s = await api("shopify-status", {});
      state.status = s;
      if (s.connected) {
        // Paint the app immediately from the status snapshot, then load the
        // blog list + saved settings in the background and re-render when they
        // arrive (renderApp keeps the active tab, so this never disrupts the
        // user). This avoids blocking the first paint on an extra round trip.
        renderApp();
        // Re-sync the Shopify billing entitlement on every open (covers the
        // merchant returning from Shopify's hosted pricing page). Fire-and-forget
        // — it never blocks or disrupts the UI.
        billingRequest().catch(()=>{});
        api("shopify-brand", {}).then((b)=>{
          const chosen = state.settings.language;
          state.settings = b.settings || {};
          state.blogs = b.blogs || [];
          if (state.settings.language) {
            rememberLang(state.settings.language);
          } else if (chosen) {
            // No saved language for this store: keep showing the current one,
            // and store it only if the merchant explicitly picked it on the
            // connect screen (the browser's remembered language may come from
            // another store opened in the same browser).
            state.settings.language = chosen;
            if (state.langPicked) {
              api("shopify-brand", {
                language: chosen
              }).catch(()=>{});
            }
          }
          renderApp();
        }).catch(()=>{});
      } else {
        state.session = null;
        renderConnect();
      }
    } catch (e) {
      setRoot(notice(t("Could not load the app:") + " " + e.message));
    }
  }
  // Wait for App Bridge to be ready, then boot. Give up after ~6s with a clear
  // message (e.g. the page was opened outside the Shopify admin).
  //
  // The language remembered in this browser applies from the very first paint
  // (the store's saved setting takes over once it loads).
  state.settings.language = savedLang() || undefined;
  let bootAttempts = 0;
  function boot() {
    // Managed installation: Shopify grants scopes at install time and always
    // opens the app embedded, so App Bridge is present and issues session
    // tokens. We just wait for it — no top-level OAuth redirect. The backend
    // exchanges the session token for an offline Admin API token on demand.
    if (window.shopify && typeof shopify.idToken === "function") {
      load();
    } else if (bootAttempts++ < 60) {
      setTimeout(boot, 100);
    } else {
      setRoot(notice("This app must be opened from inside your Shopify admin. Please open it from Apps in your store."));
    }
  }
  boot();
})();/*]]>*/</script>
