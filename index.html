        state.settings.language = langSel.value;
        toast("Language saved");
      } catch (e) {
        toast(e.message, true);
      }
    };
    langCard.append(field("Interface / content language", langSel));
    p.append(langCard);
    const danger = el("div", {
      class: "pubai-card pubai-danger"
    });
    danger.append(el("div", {
      class: "pubai-label"
    }, [
      "Disconnect from Publicator AI"
    ]));
    danger.append(el("p", {
      class: "pubai-muted"
    }, [
      "Content already published stays in your store. You can reconnect anytime."
    ]));
    const dbtn = el("button", {
      class: "pubai-btn pubai-btn-danger",
      type: "button"
    }, [
      "Disconnect"
    ]);
    dbtn.onclick = async ()=>{
      dbtn.disabled = true;
      try {
        await api("shopify-disconnect", {});
        toast("Disconnected");
        await load();
      } catch (e) {
        toast(e.message, true);
        dbtn.disabled = false;
      }
    };
    danger.append(dbtn);
    p.append(danger);
    return p;
  }
  function header(_connected) {
    return el("div", {
      class: "pubai-topbar"
    }, [
      el("div", {
        class: "pubai-brand"
      }, [
        "Publicator AI"
      ])
    ]);
  }
  // --- Boot ------------------------------------------------------------------
  async function load() {
    setRoot(spinner());
    try {
      const s = await api("shopify-status", {});
      state.status = s;
      if (s.connected) {
        try {
          const b = await api("shopify-brand", {});
          state.settings = b.settings || {};
          state.blogs = b.blogs || [];
        } catch  {}
        renderApp();
      } else {
        state.session = null;
        renderConnect();
      }
    } catch (e) {
      setRoot(banner("Could not load the app: " + e.message));
    }
  }
  // Wait for App Bridge to be ready, then boot. Give up after ~6s with a clear
  // message (e.g. the page was opened outside the Shopify admin).
  let bootAttempts = 0;
  function boot() {
    if (window.shopify && typeof shopify.idToken === "function") {
      load();
    } else if (bootAttempts++ < 60) {
      setTimeout(boot, 100);
    } else {
      setRoot(banner("This app must be opened from inside your Shopify admin. Please open it from Apps in your store."));
    }
  }
  boot();
})();/*]]>*/</script>
