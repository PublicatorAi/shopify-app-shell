  async function api(path, body = {}) {
    const t = await token();
    const resp = await fetch(`${CFG.appBase}/${path}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${t}`
      },
      body: JSON.stringify(body)
    });
    const data = await resp.json().catch(()=>({}));
    if (!resp.ok || data.success === false) {
      throw new Error(data.error || `Request failed (${resp.status}).`);
    }
    return data;

  // --- Custom dropdown (matches the WordPress plugin's font + design) ---------
  // Native <select> option lists are OS-rendered and ignore the page font, so a
  // custom control is used to keep the Inter typeface and the plugin's styling.
  function customSelect(options, initial, onChange) {
    const node = el("div", {
      class: "pub-select"
    });
    node.pubValue = initial;
    const labelEl = el("span", {
      class: "pub-select-value"
    });
    const setLabel = (v)=>{
      const o = options.find((x)=>x.value === v);
      labelEl.textContent = o ? o.label : "";
    };
    setLabel(initial);
    const trigger = el("button", {
      class: "pub-select-btn",
      type: "button"
    }, [
      labelEl,
      icon("chevron-down", 16, "pub-select-chev")
    ]);
    const list = el("div", {
      class: "pub-select-list",
      role: "listbox"
    });
    const rebuild = ()=>{
      list.innerHTML = "";
      for (const o of options){
        const item = el("button", {
          class: "pub-select-option" + (o.value === node.pubValue ? " is-selected" : ""),
          type: "button"
        }, [
          o.label
        ]);
        item.onclick = ()=>{
          node.pubValue = o.value;
          setLabel(o.value);
          close();
          if (onChange) onChange(o.value);
        };
        list.append(item);
      }
    };
    const outside = (e)=>{
      if (!node.contains(e.target)) close();
    };
    const open = ()=>{
      rebuild();
      node.classList.add("is-open");
      setTimeout(()=>document.addEventListener("click", outside), 0);
    };
    const close = ()=>{
      node.classList.remove("is-open");
      document.removeEventListener("click", outside);
    };
    trigger.onclick = ()=>{
      node.classList.contains("is-open") ? close() : open();
    };
    node.append(trigger, list);
    return node;
  }

      type: "button"
    }, [

    ]);
    emailPill.onclick = ()=>{
      state.method = "email";
      renderConnect();
    };
    keyPill.onclick = ()=>{

      renderConnect();
    };
    toggle.append(emailPill, keyPill);
    card.append(toggle);
    const errBox = el("div", {});
    const showErr = (m)=>{
      errBox.innerHTML = "";
      errBox.append(notice(m));
    };
    if (state.method === "email") {
      if (!state.session) {
        const email = el("input", {
          type: "email",
          placeholder: "you@example.com",
          autocomplete: "email"
        });
        const pass = el("input", {
          type: "password",
          placeholder: "••••••••",
          autocomplete: "current-password"
        });
        const signIn = btn("Sign in", "primary", null, async ()=>{
          signIn.disabled = true;
          try {
            const res = await api("shopify-login", {
              email: email.value,
              password: pass.value
            });
            state.session = res;
            const p = await api("shopify-projects", {
              access_token: res.access_token,
              user_id: res.user_id
            });
            state.projects = p.projects || [];
            renderConnect();
          } catch (e) {
            showErr(e.message);
            signIn.disabled = false;
          }
        });
        card.append(field("Email address", email), field("Password", pass), signIn, errBox);
      } else {
        card.append(el("div", {
          class: "pub-logged-as"
        }, [
          icon("check-circle-2", 14),
          el("span", {}, [
            "Signed in as:"
          ]),
          " ",
          el("strong", {}, [
            state.session.email || ""
          ])
        ]));
        const projOpts = [
          {
            value: "",
            label: "— Select a project —"
          }

        for (const pr of state.projects){

            value: pr.id,

        const select = customSelect(projOpts, "");
        const connect = btn("Connect", "primary", null, async ()=>{

          connect.disabled = true;
          try {

        const back = btn("← Back", "ghost", null, ()=>{
          state.session = null;
          renderConnect();
        });
        card.append(field("Select a project", select), connect, back, errBox);
      }
    } else {
      const key = el("input", {
        type: "text",
        placeholder: "sk_…",
        autocomplete: "off",
        spellcheck: false

      const connect = btn("Connect", "primary", null, async ()=>{

      document.createTextNode("Open Publicator Webshop")
    ]);
    card.append(el("div", {
      class: "pub-actions"
    }, [
      testBtn,
      openBtn,
      out
    ]));
    return el("section", {
      class: "pub-tab-panel is-active"
    }, [
      pageHead("Connection", "Connection details and a one-click test."),
      card
    ]);
  }
  function productsPanel() {
    const s = state.status || {};
    const card = el("div", {
      class: "pub-card pub-card-no-hover"
    });
    card.append(el("p", {
      class: "pub-hint"
    }, [
      "Publicator Webshop writes product descriptions from your catalog. Sync your products so the engine knows what exists in your store."
    ]));
    card.append(el("div", {
      class: "pub-info-grid"
    }, [
      infoItem("Products synced", String(s.products_synced ?? 0)),
      infoItem("Last sync", fmtDate(s.last_feed_sync_at))
    ]));
    const out = el("span", {
      class: "pub-inline-note"
    });
    const syncBtn = btn("Sync products now", "primary", "refresh-cw", async ()=>{
      syncBtn.disabled = true;
      out.textContent = t("Starting sync…");
      try {
        const r = await api("shopify-products-sync", {});
        out.textContent = r.bulk_operation_id ? t("Sync started. Products will appear shortly.") : t("Sync requested.");
        toast("Product sync started");
      } catch (e) {
        out.textContent = e.message;
      }
      syncBtn.disabled = false;
    });
    card.append(el("div", {
      class: "pub-sync-wrap"
    }, [
      syncBtn,
      out
    ]));
    return el("section", {
      class: "pub-tab-panel is-active"
    }, [
      pageHead("Products", "Sync your Shopify catalog into Publicator Webshop."),
      card
    ]);
  }
  function taxonomiesPanel() {
    const card = el("div", {
      class: "pub-card pub-card-no-hover"
    });
    card.append(el("p", {
      class: "pub-hint"
    }, [
      "Push your Shopify blogs, collections and product types to Publicator Webshop so it only uses taxonomies that really exist."
    ]));
    const out = el("span", {
      class: "pub-inline-note"
    });
    const syncBtn = btn("Sync collections & tags", "primary", "refresh-cw", async ()=>{
      syncBtn.disabled = true;
      out.textContent = t("Syncing…");
      try {
        const r = await api("shopify-taxonomies-sync", {});
        const c = r.counts || {};
        out.textContent = tf("Synced {c} collections, {b} blogs, {p} product types.", {
          c: c.collections ?? 0,
          b: c.blogs ?? 0,
          p: c.product_types ?? 0
        });
        toast("Taxonomies synced");
      } catch (e) {
        out.textContent = e.message;
      }
      syncBtn.disabled = false;
    });
    card.append(el("div", {
      class: "pub-sync-wrap"
    }, [
      syncBtn,
      out
    ]));
    return el("section", {
      class: "pub-tab-panel is-active"
    }, [
      pageHead("Collections & tags", "Keep Publicator Webshop in sync with your store's collections."),
      card
    ]);
  }
  function appearancePanel() {
    const card = el("div", {
      class: "pub-card pub-card-no-hover"
    });
    card.append(el("p", {
      class: "pub-hint"
    }, [
      "Where content goes and how it looks — pick the default blog for articles and the primary colour used in call-to-action buttons."
    ]));
    const blogOpts = [
      {
        value: "",
        label: "Auto (first blog)"
      }
    ];
    for (const b of state.blogs){
      blogOpts.push({
        value: b.id,
        label: b.title
      });
    }
    const blogSel = customSelect(blogOpts, state.settings.default_blog_id || "");
    card.append(field("Default blog for articles", blogSel));
    const colorText = el("input", {
      type: "text",
      placeholder: "#00D170",
      value: state.settings.primary_color || "",
      autocomplete: "off",
      spellcheck: false,
      maxlength: 7
    });
    const colorPick = el("input", {
      type: "color",
      value: /^#[0-9a-f]{6}$/i.test(state.settings.primary_color || "") ? state.settings.primary_color : "#00D170"
    });
    colorPick.oninput = ()=>{
      colorText.value = colorPick.value;
    };
    const colorField = el("span", {
      class: "pub-color-field"
    }, [
      colorPick,
      colorText
    ]);
    card.append(field("Primary colour (for CTAs)", colorField));
    const out = el("span", {
      class: "pub-inline-note"
    });
    const saveBtn = btn("Save appearance", "primary", "save", async ()=>{
      saveBtn.disabled = true;
      out.textContent = t("Saving…");
      try {
        const r = await api("shopify-brand", {
          default_blog_id: blogSel.pubValue,
          primary_color: colorText.value
        });
        state.settings = r.settings || state.settings;
        out.textContent = t("Saved.");
        toast("Appearance saved");
      } catch (e) {
        out.textContent = e.message;
      }
      saveBtn.disabled = false;
    });
    card.append(el("div", {
      class: "pub-actions"
    }, [
      saveBtn,
      out
    ]));
    return el("section", {
      class: "pub-tab-panel is-active"
    }, [
      pageHead("Appearance", "Where content goes and how it looks."),
      card
    ]);
  }
  function settingsPanel() {
    const section = el("section", {
      class: "pub-tab-panel is-active"
    }, [
      pageHead("Settings", "Preferences and disconnection.")
    ]);
    // Language.
    const langCard = el("div", {
      class: "pub-card pub-card-no-hover"
    });
    const langOpts = [
      {
        value: "hu_HU",
        label: "Magyar"
      },
      {
        value: "en_US",
        label: "English"
      },
      {
        value: "de_DE",
        label: "Deutsch"
      },
      {
        value: "es_ES",
        label: "Español"
      },
      {
        value: "it_IT",
        label: "Italiano"
      },
      {
        value: "sk_SK",
        label: "Slovenčina"
      }
    ];
    const langSel = customSelect(langOpts, state.settings.language || "en_US", async (v)=>{
      try {
        await api("shopify-brand", {
          language: v
        });
        state.settings.language = v;
        toast("Language saved");
        renderApp(); // re-render the whole UI in the newly chosen language
      } catch (e) {
        toast(e.message, true);
      }
    });
    langCard.append(el("div", {
      class: "pub-language-row"
    }, [
      el("div", {
        class: "pub-language-text"
      }, [
        el("div", {
          class: "pub-language-label"
        }, [
          "Interface / content language"
        ]),
        el("p", {
          class: "pub-language-desc"
        }, [
          "Choose the language Publicator Webshop uses for this store's content."
        ])
      ]),
      el("div", {
        class: "pub-language-control"
      }, [
        langSel
      ])
    ]));
    section.append(langCard);
    // Danger.
    const danger = el("div", {
      class: "pub-card pub-card-no-hover pub-danger-card"
    });
    const disc = btn("Disconnect", "danger", "log-out", async ()=>{
      disc.disabled = true;
      try {
        await api("shopify-disconnect", {});
        toast("Disconnected");
        await load();
      } catch (e) {
        toast(e.message, true);
        disc.disabled = false;
      }
    });
    danger.append(el("div", {
      class: "pub-danger-row"
    }, [
      el("div", {
        class: "pub-danger-text"
      }, [
        el("div", {
          class: "pub-danger-label"
        }, [
          "Disconnect from Publicator Webshop"
        ]),
        el("p", {
          class: "pub-danger-desc"
        }, [
          "Content already published stays in your store. You can reconnect anytime."
        ])
      ]),
      disc
    ]));
    section.append(danger);
    return section;
  }
  // --- Boot ------------------------------------------------------------------
  async function load() {
    setRoot(loadingBlock("Loading live data…"));
    try {
      const s = await api("shopify-status", {});
      state.status = s;
      if (s.connected) {
        try {
          const b = await api("shopify-brand", {});
          state.settings = b.settings || {};
          state.blogs = b.blogs || [];
        } catch  {}
        renderApp();
      } else {
        state.session = null;
        renderConnect();
      }
    } catch (e) {
      setRoot(notice(t("Could not load the app:") + " " + e.message));
    }
  }
  // Wait for App Bridge to be ready, then boot. Give up after ~6s with a clear
  // message (e.g. the page was opened outside the Shopify admin).
  let bootAttempts = 0;
  function boot() {
    if (window.shopify && typeof shopify.idToken === "function") {
      load();
    } else if (bootAttempts++ < 60) {
      setTimeout(boot, 100);
    } else {
      setRoot(notice("This app must be opened from inside your Shopify admin. Please open it from Apps in your store."));
    }
  }
  boot();
})();/*]]>*/</script>
