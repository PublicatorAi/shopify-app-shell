.pub-danger-card { border-color:#fde0e0; }

  .pub-tabs { flex-direction:row; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }

  .pub-tab { white-space:nowrap; flex-shrink:0; }
  .pub-sidebar-foot { display:none; }
  .pub-stat-grid { grid-template-columns:repeat(2,1fr); }
  .pub-main { padding:22px 18px; }
}
@media (max-width:560px) {
  .pub-stat-grid { grid-template-columns:repeat(2,1fr); }
  .pub-language-row, .pub-danger-row { flex-direction:column; }
}

  // --- Custom dropdown (matches the WordPress plugin's font + design) ---------
  // Native <select> option lists are OS-rendered and ignore the page font, so a
  // custom control is used to keep the Inter typeface and the plugin's styling.
  function customSelect(options, initial, onChange) {
    const node = el("div", {
      class: "pub-select"
    });
    node.pubValue = initial;
    const labelEl = el("span", {
      class: "pub-select-value"
    });
    const setLabel = (v)=>{
      const o = options.find((x)=>x.value === v);
      labelEl.textContent = o ? o.label : "";
    };
    setLabel(initial);
    const trigger = el("button", {
      class: "pub-select-btn",
      type: "button"
    }, [
      labelEl,
      icon("chevron-down", 16, "pub-select-chev")
    ]);
    const list = el("div", {
      class: "pub-select-list",
      role: "listbox"
    });
    const rebuild = ()=>{
      list.innerHTML = "";
      for (const o of options){
        const item = el("button", {
          class: "pub-select-option" + (o.value === node.pubValue ? " is-selected" : ""),
          type: "button"
        }, [
          o.label
        ]);
        item.onclick = ()=>{
          node.pubValue = o.value;
          setLabel(o.value);
          close();
          if (onChange) onChange(o.value);
        };
        list.append(item);
      }
    };
    const outside = (e)=>{
      if (!node.contains(e.target)) close();
    };
    const open = ()=>{
      rebuild();
      node.classList.add("is-open");
      setTimeout(()=>document.addEventListener("click", outside), 0);
    };
    const close = ()=>{
      node.classList.remove("is-open");
      document.removeEventListener("click", outside);
    };
    trigger.onclick = ()=>{
      node.classList.contains("is-open") ? close() : open();
    };
    node.append(trigger, list);
    return node;
  }

    colorPick.oninput = ()=>{
      colorText.value = colorPick.value;
    };
    const colorField = el("span", {
      class: "pub-color-field"
    }, [
      colorPick,
      colorText
    ]);
    card.append(field("Primary colour (for CTAs)", colorField));
    const out = el("span", {
      class: "pub-inline-note"
    });
    const saveBtn = btn("Save appearance", "primary", "save", async ()=>{
      saveBtn.disabled = true;
      out.textContent = "Saving…";
      try {
        const r = await api("shopify-brand", {
          default_blog_id: blogSel.pubValue,
          primary_color: colorText.value
        });
        state.settings = r.settings || state.settings;
        out.textContent = "Saved.";
        toast("Appearance saved");
      } catch (e) {
        out.textContent = e.message;
      }
      saveBtn.disabled = false;
    });
    card.append(el("div", {
      class: "pub-actions"
    }, [
      saveBtn,
      out
    ]));
    return el("section", {
      class: "pub-tab-panel is-active"
    }, [
      pageHead("Appearance", "Where content goes and how it looks."),
      card
    ]);
  }
  function settingsPanel() {
    const section = el("section", {
      class: "pub-tab-panel is-active"
    }, [
      pageHead("Settings", "Preferences and disconnection.")
    ]);
    // Language.
    const langCard = el("div", {
      class: "pub-card pub-card-no-hover"
    });
    const langOpts = [
      {
        value: "hu_HU",
        label: "Magyar"
      },
      {
        value: "en_US",
        label: "English"
      },
      {
        value: "de_DE",
        label: "Deutsch"
      },
      {
        value: "es_ES",
        label: "Español"
      },
      {
        value: "it_IT",
        label: "Italiano"
      },
      {
        value: "sk_SK",
        label: "Slovenčina"
      }
    ];
    const langSel = customSelect(langOpts, state.settings.language || "hu_HU", async (v)=>{
      try {
        await api("shopify-brand", {
          language: v
        });
        state.settings.language = v;
        toast("Language saved");
      } catch (e) {
        toast(e.message, true);
      }
    });
    langCard.append(el("div", {
      class: "pub-language-row"
    }, [
      el("div", {
        class: "pub-language-text"
      }, [
        el("div", {
          class: "pub-language-label"
        }, [
          "Interface / content language"
        ]),
        el("p", {
          class: "pub-language-desc"
        }, [
          "Choose the language Publicator Webshop uses for this store's content."
        ])
      ]),
      el("div", {
        class: "pub-language-control"
      }, [
        langSel
      ])
    ]));
    section.append(langCard);
    // Danger.
    const danger = el("div", {
      class: "pub-card pub-card-no-hover pub-danger-card"
    });
    const disc = btn("Disconnect", "danger", "log-out", async ()=>{
      disc.disabled = true;
      try {
        await api("shopify-disconnect", {});
        toast("Disconnected");
        await load();
      } catch (e) {
        toast(e.message, true);
        disc.disabled = false;
      }
    });
    danger.append(el("div", {
      class: "pub-danger-row"
    }, [
      el("div", {
        class: "pub-danger-text"
      }, [
        el("div", {
          class: "pub-danger-label"
        }, [
          "Disconnect from Publicator Webshop"
        ]),
        el("p", {
          class: "pub-danger-desc"
        }, [
          "Content already published stays in your store. You can reconnect anytime."
        ])
      ]),
      disc
    ]));
    section.append(danger);
    return section;
  }
  // --- Boot ------------------------------------------------------------------
  async function load() {
    setRoot(loadingBlock("Loading live data…"));
    try {
      const s = await api("shopify-status", {});
      state.status = s;
      if (s.connected) {
        try {
          const b = await api("shopify-brand", {});
          state.settings = b.settings || {};
          state.blogs = b.blogs || [];
        } catch  {}
        renderApp();
      } else {
        state.session = null;
        renderConnect();
      }
    } catch (e) {
      setRoot(notice("Could not load the app: " + e.message));
    }
  }
  // Wait for App Bridge to be ready, then boot. Give up after ~6s with a clear
  // message (e.g. the page was opened outside the Shopify admin).
  let bootAttempts = 0;
  function boot() {
    if (window.shopify && typeof shopify.idToken === "function") {
      load();
    } else if (bootAttempts++ < 60) {
      setTimeout(boot, 100);
    } else {
      setRoot(notice("This app must be opened from inside your Shopify admin. Please open it from Apps in your store."));
    }
  }
  boot();
})();/*]]>*/</script>
