<style type="text/css">/*<![CDATA[*/
:root {
  --pub-brand:#2563eb; --pub-ink:#000000; --pub-ink-2:#374151; --pub-muted:#6b7280;
  --pub-faint:#9ca3af; --pub-line:#e5e7eb; --pub-line-2:#f3f4f6; --pub-soft:#f9fafb;
  --pub-avatar:#111111;
  --pub-emerald-50:#ecfdf5; --pub-emerald-200:#a7f3d0; --pub-emerald-400:#34d399;
  --pub-emerald-500:#10b981; --pub-emerald-600:#059669; --pub-emerald-700:#047857;
  --pub-amber-50:#fffbeb; --pub-amber-200:#fde68a; --pub-amber-400:#fbbf24;
  --pub-amber-500:#f59e0b; --pub-amber-600:#d97706; --pub-amber-700:#b45309; --pub-amber-800:#92400e;
  --pub-blue-50:#eff6ff; --pub-blue-100:#dbeafe; --pub-blue-600:#2563eb; --pub-blue-700:#1d4ed8;
  --pub-violet-50:#f5f3ff; --pub-violet-600:#7c3aed;
  --pub-red-50:#fef2f2; --pub-red-200:#fecaca; --pub-red-600:#dc2626; --pub-red-700:#b91c1c;
  --pub-shadow:0 10px 30px -10px rgba(0,0,0,.05);
  --pub-shadow-md:0 8px 24px -4px rgba(0,0,0,.06);
  --pub-shadow-lg:0 20px 50px -10px rgba(0,0,0,.12);
  --pub-r-sm:8px; --pub-r-md:12px; --pub-r-lg:16px; --pub-r-full:9999px;
}
* { box-sizing:border-box; }
body { margin:0; background:#fff; color:var(--pub-ink); font-size:14px;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
#pub-root { padding:20px 16px 40px; }
.pub-lucide { flex-shrink:0; }

/* ===== App shell (connected) ===== */
.pub-app { display:flex; max-width:1100px; min-height:560px; margin:0 auto;
  background:#fff; border:1px solid var(--pub-line); border-radius:18px;
  box-shadow:var(--pub-shadow); overflow:hidden; }
.pub-sidebar { width:256px; flex-shrink:0; background:#fff; border-right:1px solid var(--pub-line);
  display:flex; flex-direction:column; padding:20px 14px; }
.pub-sidebar-head { padding:4px 6px 16px; border-bottom:1px solid var(--pub-line-2); margin-bottom:14px; }
.pub-logo-img { height:26px; width:auto; max-width:210px; display:block; }
.pub-sidebar-head .pub-logo-img { margin-bottom:14px; }
.pub-conn-chip { display:inline-flex; align-items:center; gap:6px; padding:4px 10px;
  border-radius:var(--pub-r-full); font-size:11px; font-weight:600; line-height:1; }
.pub-conn-chip.connected { background:var(--pub-emerald-50); border:1px solid var(--pub-emerald-200); color:var(--pub-emerald-700); }
.pub-conn-chip.disconnected { background:var(--pub-amber-50); border:1px solid var(--pub-amber-200); color:var(--pub-amber-700); }
.pub-tabs { display:flex; flex-direction:column; gap:2px; flex:1; }
.pub-tab { display:flex; align-items:center; gap:11px; width:100%; text-align:left; cursor:pointer;
  background:transparent; border:none; padding:10px 12px; border-radius:var(--pub-r-md);
  font-size:14px; font-weight:500; color:var(--pub-ink-2); font-family:inherit;
  transition:background .15s, color .15s; }
.pub-tab .pub-nav-ic { color:var(--pub-faint); transition:color .15s; }
.pub-tab:hover { background:var(--pub-soft); color:var(--pub-ink); }
.pub-tab:hover .pub-nav-ic { color:var(--pub-ink-2); }
.pub-tab.is-active { background:var(--pub-ink); color:#fff; font-weight:600; }
.pub-tab.is-active .pub-nav-ic { color:#fff; }
.pub-sidebar-foot { padding-top:12px; border-top:1px solid var(--pub-line-2); margin-top:8px;
  display:flex; flex-direction:column; gap:8px; }
.pub-account { position:relative; }
.pub-account-toggle { display:flex; align-items:center; gap:10px; width:100%; background:#fff;
  border:1px solid var(--pub-line); border-radius:var(--pub-r-md); padding:10px 12px;
  box-shadow:var(--pub-shadow-md); cursor:pointer; font-family:inherit; text-align:left; color:inherit;
  transition:border-color .15s; }
.pub-account-toggle:hover { border-color:#d1d5db; }
.pub-avatar { width:34px; height:34px; border-radius:10px; flex-shrink:0; background:var(--pub-avatar);
  color:#fff; display:flex; align-items:center; justify-content:center;
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; text-transform:uppercase; }
.pub-account-info { display:flex; flex-direction:column; min-width:0; flex:1; }
.pub-account-name { font-size:13px; font-weight:600; color:var(--pub-ink); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; max-width:150px; font-family:'Space Grotesk',sans-serif; }
.pub-account-status { display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--pub-muted); }
.pub-acct-dot { width:6px; height:6px; border-radius:50%; background:var(--pub-faint); flex-shrink:0; }
.pub-acct-dot.active { background:var(--pub-emerald-500); }
.pub-account-chevron { color:var(--pub-faint); margin-left:auto; flex-shrink:0; transition:transform .2s; }
.pub-account.is-open .pub-account-chevron { transform:rotate(180deg); }
.pub-account-menu { position:absolute; bottom:calc(100% + 6px); left:0; right:0; background:#fff;
  border:1px solid var(--pub-line); border-radius:var(--pub-r-md); box-shadow:var(--pub-shadow-lg);
  padding:4px; z-index:70; display:none; animation:pub-fade .14s ease; }
.pub-account.is-open .pub-account-menu { display:block; }
.pub-account-menu a, .pub-account-menu button { display:flex; align-items:center; gap:9px; width:100%;
  text-align:left; padding:9px 10px; background:none; border:none; cursor:pointer;
  border-radius:var(--pub-r-sm); font-size:13px; color:var(--pub-ink-2); text-decoration:none;
  font-family:inherit; transition:background .12s, color .12s; }
.pub-account-menu a:hover, .pub-account-menu button:hover { background:var(--pub-soft); color:var(--pub-ink); }
.pub-account-menu .pub-menu-sep { height:1px; background:var(--pub-line-2); margin:4px 2px; padding:0; }
.pub-account-menu .pub-menu-danger { color:var(--pub-amber-700); }
.pub-account-menu .pub-menu-danger:hover { background:var(--pub-amber-50); color:var(--pub-amber-800); }
.pub-version { font-size:10px; color:var(--pub-faint); text-align:center; padding-top:2px; }

.pub-main { flex:1; min-width:0; padding:28px 32px; background:#fff; }
.pub-tab-panel { animation:pub-slide-up .22s cubic-bezier(.22,.61,.36,1); }
@keyframes pub-slide-up { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
.pub-page-title { font-family:'Space Grotesk',-apple-system,sans-serif; font-size:24px; font-weight:700;
  color:var(--pub-ink); margin:0 0 6px; letter-spacing:-0.01em; }
.pub-page-subtitle { font-size:14px; color:var(--pub-muted); margin:0 0 22px; }

/* ===== Disconnected shell ===== */
.pub-shell { max-width:560px; margin:0 auto; }
.pub-shell-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }

/* ===== Cards ===== */
.pub-card { background:#fff; border:1px solid var(--pub-line); border-radius:var(--pub-r-lg);
  padding:24px; margin-bottom:16px; box-shadow:var(--pub-shadow); transition:border-color .2s; }
.pub-card:hover { border-color:#d1d5db; }
.pub-card-no-hover:hover { border-color:var(--pub-line); }
.pub-hint { font-size:14px; color:var(--pub-muted); margin:0 0 16px; line-height:1.55; }
.pub-signup { margin:18px 0 0; padding-top:14px; border-top:1px solid var(--pub-line-2);
  font-size:13px; color:var(--pub-muted); text-align:center; }
.pub-signup-link { color:var(--pub-ink); font-weight:600; text-decoration:underline;
  background:none; border:0; padding:0; font:inherit; cursor:pointer; }
.pub-signup-head { display:flex; align-items:center; gap:8px; margin:0 0 8px; color:var(--pub-ink); }
.pub-signup-title { font-family:'Space Grotesk',-apple-system,sans-serif; font-size:18px; font-weight:700;
  margin:0; color:var(--pub-ink); }
.pub-legal { font-size:12px; color:var(--pub-muted); margin:4px 0 14px; line-height:1.5; }
.pub-legal a { color:var(--pub-ink); text-decoration:underline; }
.pub-plan-banner { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:0 0 20px; }
.pub-plan-banner .pub-notice { flex:1; min-width:240px; margin:0; }
.pub-card-title { font-family:'Space Grotesk',-apple-system,sans-serif; font-size:16px; font-weight:700;
  margin:0 0 12px; color:var(--pub-ink); }
.pub-recent { margin-top:24px; }
.pub-recent-empty { margin:0; }
.pub-recent-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.pub-recent-item { display:flex; align-items:center; gap:12px; padding:10px 12px;
  border:1px solid var(--pub-line-2); border-radius:var(--pub-r-md); background:var(--pub-soft); }
.pub-recent-ic { display:flex; color:var(--pub-muted); }
.pub-recent-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.pub-recent-main strong { font-size:14px; font-weight:600; color:var(--pub-ink);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pub-recent-meta { font-size:12px; color:var(--pub-muted); }
.pub-recent-links { display:flex; gap:12px; flex-shrink:0; }
.pub-recent-links a { font-size:13px; color:var(--pub-ink); font-weight:500; text-decoration:underline; }
.pub-desc-filters { flex-wrap:wrap; }
.pub-desc-actions { flex-wrap:wrap; margin-top:4px; }
.pub-desc-note { display:block; margin:10px 0 0; }
.pub-desc-selall { display:inline-block; margin:16px 0 8px; font-size:13px; }
.pub-desc-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.pub-desc-item { display:flex; align-items:center; gap:12px; padding:8px 12px; border:1px solid var(--pub-line-2);
  border-radius:var(--pub-r-md); background:#fff; }
.pub-desc-item.is-open { border-color:var(--pub-ink); }
.pub-desc-check { display:flex; align-items:center; cursor:pointer; }
.pub-desc-check input { width:16px; height:16px; margin:0; accent-color:var(--pub-ink); cursor:pointer; }
.pub-desc-thumb { width:36px; height:36px; border-radius:6px; object-fit:cover; background:var(--pub-soft); flex-shrink:0; }
.pub-desc-title { flex:1; min-width:0; font-size:14px; color:var(--pub-ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pub-desc-badge { font-size:12px; font-weight:600; padding:3px 8px; border-radius:999px; white-space:nowrap; }
.pub-desc-badge.is-none { background:var(--pub-line-2); color:var(--pub-muted); }
.pub-desc-badge.is-draft { background:var(--pub-amber-50); color:var(--pub-amber-700); }
.pub-desc-badge.is-published { background:var(--pub-emerald-50); color:var(--pub-emerald-700); }
.pub-desc-preview { margin:16px 0 4px; padding:16px 18px; border:1px solid var(--pub-line); border-radius:var(--pub-r-lg);
  background:var(--pub-soft); }
.pub-desc-html { font-size:14px; line-height:1.6; color:var(--pub-ink-2); background:#fff; border:1px solid var(--pub-line-2);
  border-radius:var(--pub-r-md); padding:12px 16px; max-height:360px; overflow:auto; }
.pub-desc-html h2, .pub-desc-html h3, .pub-desc-html h4 { font-size:15px; margin:12px 0 6px; color:var(--pub-ink); }
.pub-desc-html p { margin:0 0 10px; }
.pub-desc-html ul, .pub-desc-html ol { margin:0 0 10px; padding-left:20px; }
.pub-desc-seo { margin-top:12px; }

/* ===== Overview KPI grid ===== */
.pub-loading { display:flex; align-items:center; justify-content:center; gap:10px;
  padding:40px 4px; color:var(--pub-muted); font-size:14px; }
.pub-stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
.pub-stat { background:#fff; border:1px solid var(--pub-line); border-radius:var(--pub-r-lg);
  padding:20px; box-shadow:var(--pub-shadow); display:flex; flex-direction:column; gap:10px;
  transition:border-color .2s; }
.pub-stat:hover { border-color:#d1d5db; }
.pub-stat-icon { width:40px; height:40px; border-radius:var(--pub-r-md);
  display:flex; align-items:center; justify-content:center; }
.pub-stat-icon-blue { background:var(--pub-blue-50); color:var(--pub-blue-600); }
.pub-stat-icon-emerald { background:var(--pub-emerald-50); color:var(--pub-emerald-600); }
.pub-stat-icon-amber { background:var(--pub-amber-50); color:var(--pub-amber-600); }
.pub-stat-icon-violet { background:var(--pub-violet-50); color:var(--pub-violet-600); }
.pub-stat-num { display:block; font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700;
  color:var(--pub-ink); line-height:1.15; letter-spacing:-0.02em; word-break:break-word; }
.pub-stat-label { display:block; font-size:13px; color:var(--pub-muted); }
.pub-ov-meta { display:flex; flex-direction:column; gap:8px; }
.pub-ov-meta-item { display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--pub-soft); border:1px solid var(--pub-line-2); border-radius:var(--pub-r-md); padding:12px 16px; }
.pub-ov-meta-item span { font-size:11px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--pub-faint); font-weight:600; }
.pub-ov-meta-item strong { font-size:14px; color:var(--pub-ink); font-weight:500;
  word-break:break-all; text-align:right; }

/* ===== Connection info ===== */
.pub-info-grid { display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
.pub-info-item { background:var(--pub-soft); border:1px solid var(--pub-line-2);
  border-radius:var(--pub-r-md); padding:12px 16px; }
.pub-info-item label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--pub-faint); margin-bottom:4px; font-weight:600; }
.pub-info-item span { font-size:14px; color:var(--pub-ink); font-weight:500; }
.pub-key { display:inline-flex; align-items:center; gap:6px; }
.pub-key code { background:#fff; border:1px solid var(--pub-line); padding:2px 8px;
  border-radius:var(--pub-r-sm); font-size:13px; color:var(--pub-brand);
  font-family:'SF Mono',Menlo,Monaco,monospace; }

/* ===== Buttons ===== */
.pub-actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.pub-sync-wrap { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.pub-btn { display:inline-flex; align-items:center; gap:8px; padding:10px 18px;
  border-radius:var(--pub-r-md); font-size:14px; font-weight:500; cursor:pointer;
  border:1px solid transparent; line-height:1; font-family:inherit; text-decoration:none;
  transition:background .15s, border-color .15s, color .15s, box-shadow .15s, opacity .15s; }
.pub-btn:disabled { opacity:.55; cursor:not-allowed; }
.pub-btn-primary { background:var(--pub-ink); color:#fff; }
.pub-btn-primary:hover:not(:disabled) { background:#1f2937; box-shadow:0 4px 14px -4px rgba(0,0,0,.3); }
.pub-btn-secondary { background:#fff; color:var(--pub-ink); border-color:var(--pub-line); }
.pub-btn-secondary:hover:not(:disabled) { background:var(--pub-soft); border-color:#d1d5db; }
.pub-btn-danger { background:var(--pub-amber-50); color:var(--pub-amber-800); border-color:var(--pub-amber-200); }
.pub-btn-danger:hover:not(:disabled) { background:var(--pub-amber-200); border-color:var(--pub-amber-400); }
.pub-btn-ghost { background:none; color:var(--pub-muted); border-color:transparent; }
.pub-btn-ghost:hover:not(:disabled) { color:var(--pub-ink); background:var(--pub-soft); }
.pub-inline-note { color:var(--pub-muted); font-size:13px; }
.pub-tax-names { margin-top:14px; display:flex; flex-direction:column; gap:10px; }
.pub-tax-group { display:flex; flex-direction:column; gap:3px; }
.pub-tax-label { font-size:12px; font-weight:600; color:var(--pub-ink); text-transform:uppercase; letter-spacing:.03em; }
.pub-tax-items { font-size:13px; color:var(--pub-muted); line-height:1.5; }

.pub-spinner { width:14px; height:14px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff;
  border-radius:50%; animation:pub-spin .6s linear infinite; flex-shrink:0; display:inline-block; }
.pub-spinner.dark { border-color:rgba(0,0,0,.12); border-top-color:var(--pub-ink); }
@keyframes pub-spin { to { transform:rotate(360deg); } }

/* ===== Forms ===== */
.pub-field { margin-bottom:14px; }
.pub-field label { display:block; font-size:13px; font-weight:500; color:var(--pub-ink-2); margin-bottom:6px; }
.pub-field input, .pub-field select { width:100%; padding:10px 12px; border:1px solid #d1d5db;
  border-radius:var(--pub-r-md); font-size:14px; box-sizing:border-box; background:#fff; font-family:inherit;
  transition:border-color .15s, box-shadow .15s; }
.pub-field input:focus, .pub-field select:focus, .pub-language-control select:focus {
  outline:none; border-color:var(--pub-ink); box-shadow:0 0 0 3px rgba(0,0,0,.08); }
.pub-color-field { display:flex; align-items:center; gap:8px; }
.pub-color-field input[type="color"] { width:38px; height:38px; padding:0; border:1px solid #d1d5db;
  border-radius:var(--pub-r-md); background:none; cursor:pointer; flex-shrink:0; }
.pub-color-field input[type="text"] { flex:1; }

/* ===== Custom dropdown (Inter + plugin design, replaces native select) ===== */
.pub-select { position:relative; width:100%; }
.pub-select-btn { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%;
  padding:10px 12px; border:1px solid #d1d5db; border-radius:var(--pub-r-md); font-size:14px;
  background:#fff; color:var(--pub-ink); cursor:pointer; font-family:inherit; text-align:left;
  transition:border-color .15s, box-shadow .15s; }
.pub-select-btn:hover { border-color:#9ca3af; }
.pub-select.is-open .pub-select-btn { outline:none; border-color:var(--pub-ink); box-shadow:0 0 0 3px rgba(0,0,0,.08); }
.pub-select-value { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pub-select-chev { color:var(--pub-faint); flex-shrink:0; transition:transform .18s; }
.pub-select.is-open .pub-select-chev { transform:rotate(180deg); }
.pub-select-list { position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:60;
  background:#fff; border:1px solid var(--pub-line); border-radius:var(--pub-r-md);
  box-shadow:var(--pub-shadow-lg); padding:4px; display:none; max-height:264px; overflow:auto;
  animation:pub-fade .12s ease; }
.pub-select.is-open .pub-select-list { display:block; }
.pub-select-option { display:block; width:100%; text-align:left; padding:9px 10px; border:none;
  background:none; border-radius:var(--pub-r-sm); cursor:pointer; font-size:14px; font-family:inherit;
  color:var(--pub-ink-2); transition:background .12s, color .12s; }
.pub-select-option:hover { background:var(--pub-soft); color:var(--pub-ink); }
.pub-select-option.is-selected { background:var(--pub-soft); color:var(--pub-ink); font-weight:600; }
@keyframes pub-fade { from { opacity:0; } to { opacity:1; } }

.pub-logged-as { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--pub-emerald-700);
  background:var(--pub-emerald-50); border:1px solid var(--pub-emerald-200); border-radius:var(--pub-r-md);
  padding:10px 14px; margin-bottom:16px; }

/* ===== Notices ===== */
.pub-notice { padding:12px 16px; border-radius:var(--pub-r-md); font-size:13px; margin-top:12px;
  display:flex; align-items:flex-start; gap:10px; }
.pub-notice-error { background:var(--pub-red-50); border:1px solid var(--pub-red-200); color:var(--pub-red-700); }
.pub-notice-success { background:var(--pub-emerald-50); border:1px solid var(--pub-emerald-200); color:var(--pub-emerald-700); }
.pub-notice-info { background:var(--pub-blue-50); border:1px solid var(--pub-blue-100); color:var(--pub-blue-700); }

/* ===== Install steps + method toggle (disconnected) ===== */
.pub-install-steps { background:var(--pub-blue-50); border:1px solid var(--pub-blue-100);
  border-radius:var(--pub-r-md); padding:14px 16px; margin-bottom:20px;
  display:flex; flex-direction:column; gap:9px; }
.pub-install-step { display:flex; align-items:center; gap:11px; font-size:13px; color:#1e3a8a; }
.pub-step-num { width:24px; height:24px; border-radius:50%; background:var(--pub-brand); color:#fff;
  font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.pub-method-toggle { display:inline-flex; background:var(--pub-line-2); border:1px solid var(--pub-line);
  border-radius:var(--pub-r-full); padding:4px; gap:4px; margin-bottom:18px; }
.pub-method-pill { background:transparent; border:none; cursor:pointer; padding:8px 18px;
  border-radius:var(--pub-r-full); font-size:13px; font-weight:500; color:var(--pub-muted);
  font-family:inherit; transition:all .15s; }
.pub-method-pill:hover { color:var(--pub-ink); }
.pub-method-pill.is-active { background:var(--pub-ink); color:#fff; box-shadow:0 1px 2px rgba(0,0,0,.1); }

/* ===== Settings rows ===== */
.pub-language-row, .pub-danger-row { display:flex; align-items:flex-start; gap:16px; }
.pub-language-text, .pub-danger-text { flex:1; min-width:0; }
.pub-language-label, .pub-danger-label { font-size:14px; font-weight:600; color:var(--pub-ink);
  margin-bottom:4px; font-family:'Space Grotesk',sans-serif; }
.pub-language-desc, .pub-danger-desc { font-size:13px; color:var(--pub-muted); margin:0; line-height:1.5; }
.pub-language-control { flex-shrink:0; }
.pub-language-control .pub-select { width:200px; }
.pub-connect-lang { display:flex; justify-content:flex-end; margin-bottom:14px; }
.pub-connect-lang .pub-select { width:150px; }
.pub-danger-card { border-color:#fde0e0; }
.pub-danger-row .pub-btn { flex-shrink:0; }

/* ===== Responsive ===== */
@media (max-width:900px) {
  .pub-app { flex-direction:column; }
  .pub-sidebar { width:auto; border-right:none; border-bottom:1px solid var(--pub-line); padding:16px; }
  .pub-tabs { flex-direction:row; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
  .pub-tabs::-webkit-scrollbar { display:none; }
  .pub-tab { white-space:nowrap; flex-shrink:0; }
  .pub-sidebar-foot { display:none; }
  .pub-stat-grid { grid-template-columns:repeat(2,1fr); }
  .pub-main { padding:22px 18px; }
}
@media (max-width:560px) {
  .pub-stat-grid { grid-template-columns:repeat(2,1fr); }
  .pub-language-row, .pub-danger-row { flex-direction:column; }
}

  async function api(path, body = {}) {
    const send = async ()=>await fetch(`${CFG.appBase}/${path}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${await token()}`
        },
        body: JSON.stringify(body)
      });
    let resp = await send();
    // A session token can expire between issue and arrival — retry once with a
    // freshly issued one before surfacing an error.
    if (resp.status === 401) resp = await send();
    const data = await resp.json().catch(()=>({}));
    if (!resp.ok || data.success === false) {
      throw new Error(data.error || tf("Request failed ({status}).", {
        status: resp.status
      }));
    }
    return data;
  }

  // --- Custom dropdown (matches the WordPress plugin's font + design) ---------
  // Native <select> option lists are OS-rendered and ignore the page font, so a
  // custom control is used to keep the Inter typeface and the plugin's styling.
  function customSelect(options, initial, onChange) {
    const node = el("div", {
      class: "pub-select"
    });
    node.pubValue = initial;
    const labelEl = el("span", {
      class: "pub-select-value"
    });
    const setLabel = (v)=>{
      const o = options.find((x)=>x.value === v);
      labelEl.textContent = o ? t(o.label) : "";
    };
    setLabel(initial);
    const trigger = el("button", {
      class: "pub-select-btn",
      type: "button"
    }, [
      labelEl,
      icon("chevron-down", 16, "pub-select-chev")
    ]);
    const list = el("div", {
      class: "pub-select-list",
      role: "listbox"
    });
    const rebuild = ()=>{
      list.innerHTML = "";
      for (const o of options){
        const item = el("button", {
          class: "pub-select-option" + (o.value === node.pubValue ? " is-selected" : ""),
          type: "button"
        }, [
          o.label
        ]);
        item.onclick = ()=>{
          node.pubValue = o.value;
          setLabel(o.value);
          close();
          if (onChange) onChange(o.value);
        };
        list.append(item);
      }
    };
    const outside = (e)=>{
      if (!node.contains(e.target)) close();
    };
    const open = ()=>{
      rebuild();
      node.classList.add("is-open");
      setTimeout(()=>document.addEventListener("click", outside), 0);
    };
    const close = ()=>{
      node.classList.remove("is-open");
      document.removeEventListener("click", outside);
    };
    trigger.onclick = ()=>{
      node.classList.contains("is-open") ? close() : open();
    };
    node.append(trigger, list);
    return node;
  }

  // Render AI-written HTML safely: only plain formatting tags, no attributes.
  function safeHtml(html) {
    const box = el("div", {
      class: "pub-desc-html"
    });
    const ALLOWED = [
      "P",
      "BR",
      "STRONG",
      "B",
      "EM",
      "I",
      "U",
      "UL",
      "OL",
      "LI",
      "H2",
      "H3",
      "H4",
      "BLOCKQUOTE",
      "TABLE",
      "THEAD",
      "TBODY",
      "TR",
      "TD",
      "TH"
    ];
    const DROP = [
      "SCRIPT",
      "STYLE",
      "IFRAME",
      "OBJECT",
      "EMBED",
      "TEMPLATE",
      "NOSCRIPT",
      "SVG",
      "MATH"
    ];
    const copy = (src, dst)=>{
      for (const n of Array.from(src.childNodes)){
        if (n.nodeType === 3) dst.append(document.createTextNode(n.textContent || ""));
        else if (n.nodeType === 1) {
          const tag = String(n.tagName).toUpperCase();
          if (ALLOWED.includes(tag)) {
            const c = document.createElement(tag.toLowerCase());
            copy(n, c);
            dst.append(c);
          } else if (!DROP.includes(tag)) {
            copy(n, dst); // unknown wrapper → keep its text
          }
        }
      }
    };
    try {
      copy(new window.DOMParser().parseFromString(html, "text/html").body, box);
    } catch (_e) {
      box.textContent = html.replace(/<(script|style)[\s\S]*?<\/\1>/gi, " ").replace(/<[^>]+>/g, " ");
    }
    return box;
  }
  // Follow a generation run: refresh the list until every requested product
  // has a newer description (or ~4 minutes pass).
  let descWatch = 0;
  function watchDescriptions(ids, startedAt) {
    const run = ++descWatch;
    let tries = 0;
    const startMs = Date.parse(startedAt) - 5000;
    const tick = async ()=>{
      if (run !== descWatch) return;
      tries++;
      try {
        const r = await loadDescriptions();
        const done = (r.products || []).filter((p)=>ids.includes(p.id) && p.description_updated_at && Date.parse(p.description_updated_at) >= startMs).length;
        if (done >= ids.length) {
          state.desc.note = tf("Descriptions ready to review: {count}.", {
            count: done
          });
          if (state.activeTab === "descriptions") renderApp();
          return;
        }
        if (state.activeTab === "descriptions") renderApp();
      } catch (_e) {}
      if (tries < 30) setTimeout(tick, 8000);
      else {
        state.desc.note = t("Some descriptions are still being written. Refresh the list in a few minutes.");
        if (state.activeTab === "descriptions") renderApp();
      }
    };
    setTimeout(tick, 8000);
  }

  // Follow a started product sync (Shopify finishes the bulk export in the
  // background): poll the status for up to ~2 minutes and show the result.
  let syncWatch = 0;
  function watchSync(prevSyncAt) {
    const run = ++syncWatch;
    let tries = 0;
    const tick = async ()=>{
      if (run !== syncWatch) return; // a newer sync superseded this one
      tries++;
      try {
        const s = await api("shopify-status", {});
        if (s.connected && s.last_feed_sync_at && s.last_feed_sync_at !== prevSyncAt) {
          state.status = s;
          state.syncNote = tf("Sync finished: {count} products.", {
            count: s.products_synced ?? 0
          });
          if (state.activeTab === "products" || state.activeTab === "overview") renderApp();
          return;
        }
      } catch (_e) {}
      if (tries < 24) {
        setTimeout(tick, 5000);
      } else {
        state.syncNote = t("The sync is still running. Reload the app in a few minutes to see the result.");
        if (state.activeTab === "products") renderApp();
      }
    };
    setTimeout(tick, 5000);
  }

  // Push the merchant to choose a plan only when nothing else entitles the

        at: Date.now(),
        req: api("shopify-billing", {})

      billingCache.req.catch(()=>{
        billingCache = null; // let the next view retry after a failure
      });

        billingRequest().then((b)=>{
